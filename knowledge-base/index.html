k007","cat":"overview","title":"一句话理解核心想法","short":"不是让 AI 说“算好了”，而是要求它拿出可检查的模型和结果。","points":["命令执行、模型状态、科学结果、证据完整性分别检查。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"已实现"},{"id":"k008","cat":"overview","title":"六类工作流代表什么","short":"仓库注册了热传导、纯扩散、固体拉伸、电化学、电池、热与扩散耦合的执行路径。","points":["有代码不代表都经过真实环境全面验收。","运行时还会受到许可证、输入条件和环境限制。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/tool_registry.py","state":"有代码"},{"id":"k009","cat":"overview","title":"二维稳态导热为什么是常用基准？","short":"它有简单明确的边界条件，在特定假设下可以直接求出解析解。","points":["可以同时检查边界选择、求解温度和解析解误差。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"有代码"},{"id":"k010","cat":"overview","title":"目前最大的限制","short":"受控标准案例覆盖较好；复杂几何、非线性材料和任意多物理场还不能保证。","points":["复杂模型必须逐项建立新的验证规则。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"待突破"},{"id":"k011","cat":"overview","title":"最值得研究的问题","short":"AI 建模出了错，能不能在正式接受结果前发现错误，并说清证据。","points":["要用反例、基准模型和重复实验来验证方法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"研究问题"},{"id":"k012","cat":"position","title":"本地优先是什么意思","short":"建模工作主要在自己的电脑完成，不依靠网站在线求解。","points":["用户的 COMSOL 独立安装。","本地模型服务是否能用，要看本机环境。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"原理"},{"id":"k013","cat":"position","title":"这个软件最适合做什么","short":"重复性较高、输入清楚、能设计检查方法的建模任务。","points":["例如二维稳态导热、单轴拉伸等基准问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/tool_registry.py","state":"原理"},{"id":"k014","cat":"position","title":"不适合直接承诺什么","short":"不保证随便说一句话，就能正确建立任意复杂模型。","points":["复杂问题要先确定材料、几何、载荷、边界和求解方式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k015","cat":"position","title":"建模自动化和科学验证的区别","short":"自动化负责把步骤做出来；科学验证负责确认做出来的是不是原来要的模型。","points":["两者可以分别成功或失败。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k016","cat":"position","title":"它有没有新求解算法","short":"当前核心是调用 COMSOL，不是重新编写有限元计算方法。","points":["研究重点在工作流、错误检查和结果证据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/COMSOL_DISTRIBUTION_SCOPE.md","state":"原理"},{"id":"k017","cat":"position","title":"能不能只靠语言模型","short":"不能。语言模型写出一段看似合理的话，不代表实际边界、单位或求解条件正确。","points":["关键数据需要明确来源与规则约束。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k018","cat":"position","title":"对材料研究有什么价值","short":"可以减少机械性操作，并把参数选择和模型检查过程保存下来。","points":["复杂材料模型的科学判断仍需要研究人员。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k019","cat":"position","title":"工作台与论文的关系","short":"软件本身是工程成果；论文还需要一个能比较、能复现、能证明价值的方法问题。","points":["需要基准数据、对照方法和可量化指标。"],"source":"","state":"研究问题"},{"id":"k020","cat":"position","title":"怎样选择材料仿真基准模型？","short":"优先选择控制方程明确、边界条件完整、参考结果可信的模型。","points":["基准应包括几何、物性、研究类型、求解设置、参考数值和可接受误差。"],"source":"","state":"研究问题"},{"id":"k021","cat":"process","title":"一个任务先做什么","short":"先把研究目标拆成几何、材料、物理场、边界和求解要求。","points":["信息不全时，不应该直接开始运行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k022","cat":"process","title":"建模计划包含什么","short":"包含参数、单位、边界条件、网格方式、研究类型、预期结果和检查项。","points":["还记录哪些参数来自用户，哪些只是设定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/schemas.py","state":"原理"},{"id":"k023","cat":"process","title":"为什么先让人审核","short":"错一个边界或材料参数，模型仍可能正常求解。","points":["用户审核的是物理问题是否定义正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k024","cat":"process","title":"批准计划后发生什么","short":"执行器按已检查的计划调用 COMSOL，建立模型并尝试求解。","points":["不是将大模型的自由文字直接当作命令执行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/tool_registry.py","state":"原理"},{"id":"k025","cat":"process","title":"求解前需要看什么","short":"需要确认创建的物理接口、边界选择和参数表达式确实存在。","points":["只收到“创建成功”不够。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k026","cat":"process","title":"求解后需要看什么","short":"看温度或应力等实际数据，再检查物理范围、理论关系和保存的文件。","points":["漂亮的云图不能代替数值检查。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k027","cat":"process","title":"一个运行为什么要有编号","short":"运行编号能把这次模型、结果、日志连起来，避免把旧文件当成新结果。","points":["每次重新运行或修正都要重新留下证据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k028","cat":"process","title":"为什么要留日志","short":"出错时可以找到失败环节：计划、建模、求解还是结果检查。","points":["日志共享前应去掉隐私和许可证信息。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"原理"},{"id":"k029","cat":"process","title":"暂停、继续、停止的区别","short":"暂停要到允许暂停的位置；继续只能接着已确认暂停的任务；停止意味着本次尝试结束。","points":["停止后不能继承旧尝试的通过结论。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k030","cat":"process","title":"出错后能不能自动重试","short":"不能把“重试过”当成“修好了”。修正必须重新读回，并验证新结果。","points":["旧结果失效时不能继续显示为已通过。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/heat_recertification.py","state":"原理"},{"id":"k031","cat":"ai","title":"AI在系统里主要干什么","short":"帮助整理问题、生成建模计划和说明步骤。","points":["真正求解仍交给 COMSOL。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k032","cat":"ai","title":"AI能自行编造缺失参数吗","short":"执行计划不应补造用户没有提供的重要尺寸、边界或材料数据。","points":["缺少关键信息时应该标出缺项。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k033","cat":"ai","title":"一句“做个导热模型”为什么不够","short":"还缺几何大小、材料参数、热边界和研究方式等条件。","points":["没有这些条件，就没有唯一的物理问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k034","cat":"ai","title":"规则程序和语言模型怎么配合","short":"规则程序固定可执行事实，语言模型帮助整理和表达计划。","points":["模型不能随意改写规则已经确认的关键数值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k035","cat":"ai","title":"AI输出格式不对怎么办","short":"程序会检查计划格式，必要时尝试修正；仍不合格就拒绝或退回受控结果。","points":["格式正确也不等于科学正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k036","cat":"ai","title":"不用 AI 时能做什么","short":"有些标准问题可用受控解析逻辑生成计划。","points":["没有本地模型不等于 COMSOL 和桌面程序都不能使用。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"原理"},{"id":"k037","cat":"ai","title":"本地模型是不是软件自带","short":"不是。源码没有捆绑本地模型权重，能否连接取决于用户环境。","points":["找不到模型时应明确提示。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"原理"},{"id":"k038","cat":"ai","title":"参数来源为什么重要","short":"要分清用户输入、基准规定、文献数值和临时假设。","points":["同一个数字来源不同，可信程度可能完全不同。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/schemas.py","state":"原理"},{"id":"k039","cat":"ai","title":"假设参数能当已验证参数吗","short":"不能。假设可以帮助建立示例，但需要明确标记，不能装作实验确认值。","points":["材料热导率等数值可能随材料与温度变化。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/schemas.py","state":"原理"},{"id":"k040","cat":"ai","title":"论文里的材料参数如何使用","short":"先核对材料成分、温度、单位和测量条件，再决定是否适用。","points":["不能因为文献给出一个值，就直接套用到所有模型。"],"source":"","state":"研究问题"},{"id":"k041","cat":"ai","title":"AI的最大风险是什么","short":"输出很流畅，但可能遗漏条件、选错边界或误解数值单位。","points":["解决方法是限制执行范围并保留人工检查。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k042","cat":"comsol","title":"它怎样连接 COMSOL","short":"使用 Python 的 MPh 调用 COMSOL，同时有 Java Bridge 用于部分模型状态读取与控制。","points":["连接正常不等于模型设置正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"原理"},{"id":"k043","cat":"comsol","title":"需要单独安装 COMSOL 吗","short":"需要。真实计算要求本机有兼容的 COMSOL 6.3 和合法许可证。","points":["本软件不附带 COMSOL 或许可证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"原理"},{"id":"k044","cat":"comsol","title":"为什么不能只靠软件界面的绿色状态","short":"环境已连接，只表示可以开始操作；结果仍要靠模型读回和物理检查。","points":["启动成功、求解成功和结果正确是三回事。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"原理"},{"id":"k045","cat":"comsol","title":"创建节点成功就算成功吗","short":"不算。物理接口或边界节点创建成功后，还要看设置是否实际生效。","points":["尤其要核对选中了哪条边、哪一个面。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k046","cat":"comsol","title":"为什么边界编号容易出错","short":"几何变化后，COMSOL 给边或面的编号不一定保持原样。","points":["不能永远假设“1 号边就是左边”。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"原理"},{"id":"k047","cat":"comsol","title":"热传导怎样识别左右边界","short":"受控矩形案例会先用不同的测试温度识别边，再设置真正的温度。","points":["这套方法还不是任意复杂几何的通用方案。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"原理"},{"id":"k048","cat":"comsol","title":"三维拉伸怎样选面","short":"代码使用几何位置框来挑选固定端和加载端，并确认挑到的面。","points":["几何形状改变时要重新检查选面。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/solid_worker.py","state":"原理"},{"id":"k049","cat":"comsol","title":"读回是什么意思","short":"写入参数之后，再从真实 COMSOL 模型里把值和选择读出来比较。","points":["写入“350 K”和读到“350 K”是两个步骤。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/solid_worker.py","state":"原理"},{"id":"k050","cat":"comsol","title":"为什么要隔离执行过程","short":"某些长时间共用的 COMSOL 会话可能互相影响；受控任务可在独立进程运行。","points":["这样更容易保留单次运行的边界和故障信息。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"原理"},{"id":"k051","cat":"comsol","title":"为什么不能任意修改 MPH","short":"现阶段只支持有限的导入与预览，以及受控修改。","points":["原始 MPH 应保留；更改要在副本上测试。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k052","cat":"comsol","title":"求解失败后应该看哪里","short":"先看许可证、模型读回、边界设置和求解错误，再决定是否修改。","points":["不能直接把错误解释成“AI没反应”。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"原理"},{"id":"k053","cat":"comsol","title":"COMSOL模型与输出应该一起保存吗","short":"应该。模型文件、报告、结果图片和这次运行编号需要对应。","points":["图片单独存在不能证明它属于当前计算。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k054","cat":"heat","title":"最简单的热传导模型","short":"二维矩形，左右固定温度，上下绝热，稳态、无内热源。","points":["材料在该基准中按常数导热系数处理。","这个模型有可检查的解析解。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"原理"},{"id":"k055","cat":"heat","title":"为什么温度应沿长度变化","short":"稳态、常导热系数、无热源时，一维温度曲线是直线。","points":["T(x) = T左 + (T右 - T左) × x / L。"],"source":"","state":"理论关系"},{"id":"k056","cat":"heat","title":"左右分别 373 K 和 293 K 会怎样","short":"温度从热端向冷端下降，理想条件下不应超过两端边界温度。","points":["这是一种很容易看出方向是否反了的检查。"],"source":"","state":"理论关系"},{"id":"k057","cat":"heat","title":"上下面绝热是什么意思","short":"热量不从上边和下边穿出去。","points":["这里说的是穿过边界的法向热流为零。"],"source":"","state":"理论关系"},{"id":"k058","cat":"heat","title":"温度云图长得对就够了吗","short":"不够。颜色也可能来自一个边界设错的模型。","points":["要检查左右边界实际温度，再对比温度曲线。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"原理"},{"id":"k059","cat":"heat","title":"热传导基准主要查什么","short":"查边界位置、材料属性、温度范围和解析解误差。","points":["源码对边界温度和解析解误差设置了检查条件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"原理"},{"id":"k060","cat":"heat","title":"解析解误差是什么意思","short":"同一个位置，计算温度与理论温度相差多少。","points":["误差越小通常越接近该基准的理论结果，但还要看适用条件。"],"source":"","state":"理论关系"},{"id":"k061","cat":"heat","title":"源码里解析解误差的门槛","short":"该热传导基准把温度解析解均方根误差限制在 1 K 以内。","points":["这只是当前受控基准的规则，不是所有模型通用标准。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"有代码"},{"id":"k062","cat":"heat","title":"如果导热系数随温度变化","short":"原来的直线解析解一般不再直接适用，需要换检查方法。","points":["不要把常数材料模型的判断直接套进非线性材料。"],"source":"","state":"理论关系"},{"id":"k063","cat":"heat","title":"如果模型里有热源","short":"温度分布可能不是直线，最高温也可能出现在内部。","points":["要先改变理论检查条件，再讨论数值结果。"],"source":"","state":"理论关系"},{"id":"k064","cat":"heat","title":"如何设置一个故意出错的案例","short":"把左边界温度设错，或让边界选择指向错误的边。","points":["比较仅检查“求解成功”和检查真实边界读回的差异。"],"source":"","state":"研究设计"},{"id":"k065","cat":"heat","title":"边界条件修正后还要做什么","short":"再次从 COMSOL 读回新设置，重新求解，重新检查温度场。","points":["不能沿用修正前的通过记录。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/heat_recertification.py","state":"原理"},{"id":"k066","cat":"heat","title":"二维稳态导热为什么便于定量验证？","short":"常数导热系数、无热源、上下绝热时，温度可与一维解析解比较。","points":["可直接检查左右端温度、内部线性分布与热流守恒。"],"source":"","state":"研究设计"},{"id":"k067","cat":"physics","title":"纯扩散模型研究什么","short":"研究物质从高浓度区域向低浓度区域扩散的过程。","points":["当前注册的是二维稳态纯扩散基准。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/tds_worker.py","state":"有代码"},{"id":"k068","cat":"physics","title":"纯扩散基准限制什么","short":"不把对流、电迁移和化学反应混进这个受控案例。","points":["扩散系数与左右浓度必须明确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"有代码"},{"id":"k069","cat":"physics","title":"纯扩散要看什么结果","short":"浓度边界是否正确、通量方向、质量守恒和理论解误差。","points":["计算通过仍要有真实读回。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/tds_worker.py","state":"有代码"},{"id":"k070","cat":"physics","title":"三维单轴拉伸模型研究什么","short":"一端固定，另一端施加轴向载荷，观察位移和应力。","points":["这是简化的线弹性基准，不覆盖复杂接触和塑性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/solid_worker.py","state":"有代码"},{"id":"k071","cat":"physics","title":"单轴拉伸怎么做理论对比","short":"理想受力条件下，位移约为 F×L/(E×A)。","points":["还要看载荷施加方式、截面、边界约束与应力状态。"],"source":"","state":"理论关系"},{"id":"k072","cat":"physics","title":"拉伸模型要检查什么","short":"杨氏模量、泊松比、密度、固定面、载荷面，以及位移和应力。","points":["源码还检查力平衡。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/solid_worker.py","state":"有代码"},{"id":"k073","cat":"physics","title":"电化学模型做到哪里","short":"有一次电流分布基准执行代码。","points":["需要相关 COMSOL 模块许可。","不能等同于完整的电极反应或腐蚀模型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/electrochem_worker.py","state":"有代码"},{"id":"k074","cat":"physics","title":"电池模型做到哪里","short":"有锂离子电池放电基准执行代码。","points":["需要 Battery Design Module 及真实运行验证。","不是任意电池体系的自动建模。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/battery_worker.py","state":"有代码"},{"id":"k075","cat":"physics","title":"热传导和扩散耦合是什么意思","short":"温度变化影响扩散系数，进而影响浓度分布与扩散通量。","points":["示例使用 D(T) = D0 × T/T0。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/multiphysics_worker.py","state":"有代码"},{"id":"k076","cat":"physics","title":"耦合开关对照有什么用","short":"用同一问题比较启用和关闭温度依赖后的结果。","points":["如果结果根本没变化，要检查耦合表达式是否真正生效。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/multiphysics_worker.py","state":"有代码"},{"id":"k077","cat":"physics","title":"当前耦合是不是双向的","short":"不是。仓库注册的是温度影响扩散的单向基准。","points":["不表示浓度变化会反过来改变温度。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/multiphysics_worker.py","state":"有代码"},{"id":"k078","cat":"physics","title":"这些模块都通过实机验收了吗","short":"不能这样说。注册和实现代码并不等于独立全面实机通过。","points":["需要每个物理场自己的运行报告。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"待验证"},{"id":"k079","cat":"physics","title":"下一步最值得加的材料模型","short":"可从温度依赖材料、热应力或扩散–应力耦合中选择一个小范围案例。","points":["先有真实实验或高可信数值对照，再扩展自动化。"],"source":"","state":"研究设计"},{"id":"k080","cat":"proof","title":"什么叫命令成功","short":"程序调用了 COMSOL 的某个操作，并得到成功返回。","points":["还不知道具体物理条件是否按预期生效。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k081","cat":"proof","title":"什么叫模型状态核对成功","short":"从实际 COMSOL 模型中读到了需要的设置，并与预期一致。","points":["例如温度边界选中正确位置，数值也正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k082","cat":"proof","title":"什么叫科学验证通过","short":"数值结果通过了这一类模型预先规定的物理检查。","points":["比如边界温度、解析解误差或守恒关系。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k083","cat":"proof","title":"什么叫证据完整","short":"模型文件、结果、运行编号和检查记录能相互对应，文件也能被核实。","points":["源码记录文件大小与 SHA-256 校验值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k084","cat":"proof","title":"四层都过了就绝对正确吗","short":"不能保证绝对正确。只是说明该受控工作流的既定检查通过。","points":["理论假设错误、材料数据错误仍可能导致科学结论错误。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"原理"},{"id":"k085","cat":"proof","title":"为什么要检查模型树","short":"模型树能帮助确认物理接口、材料、网格和研究步骤是否真正存在。","points":["光有结果图无法证明这些设置。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/physics/heat_transfer_validator.py","state":"原理"},{"id":"k086","cat":"proof","title":"为什么要检查单位","short":"同一个数值用 K、℃、mm、m 表示时，实际物理意义可能不同。","points":["长度和温度必须按定义正确换算。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理"},{"id":"k087","cat":"proof","title":"为什么要看守恒","short":"真实物理计算通常需要满足能量、质量或力的平衡关系。","points":["守恒失败可能说明边界、方程或数值求解有问题。"],"source":"","state":"理论关系"},{"id":"k088","cat":"proof","title":"为什么要做网格检查","short":"网格变细后，关键结果通常应该逐渐稳定，不能完全依赖某一次网格。","points":["这项验证需要按模型情况设计，不能认为当前六类都已完成。"],"source":"","state":"研究设计"},{"id":"k089","cat":"proof","title":"求解器收敛就说明物理正确吗","short":"不说明。求解器可能准确地求出了一个设置错误的问题。","points":["需要另外核对几何、材料、边界和预期结果。"],"source":"","state":"原理"},{"id":"k090","cat":"proof","title":"保存了图片就算有证据吗","short":"不算。图片可能是旧的、错误的，甚至不属于当前模型。","points":["要核对当前运行编号、原始模型和结果文件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k091","cat":"proof","title":"修改边界后旧结果为什么失效","short":"因为原问题改变了，旧求解结果回答的是旧问题。","points":["修正后需要重新求解，不能复用旧认证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/heat_recertification.py","state":"原理"},{"id":"k092","cat":"proof","title":"缺少证据时应该怎样显示","short":"标记为未验证或失败，不把它包装成成功。","points":["拒绝给出通过结论也是有价值的结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"原理"},{"id":"k093","cat":"proof","title":"什么是误报和漏报","short":"误报是把正确结果错判为错；漏报是把错误结果当成正确。","points":["比较系统时，两种情况都需要统计。"],"source":"","state":"研究设计"},{"id":"k094","cat":"proof","title":"怎样比较两个验证方法","short":"准备相同的正确与错误模型，看谁能发现更多真实错误，以及造成多少误判。","points":["还要比较速度和人工检查成本。"],"source":"","state":"研究设计"},{"id":"k095","cat":"proof","title":"是否能用人工结果做唯一标准","short":"也不行。人工模型同样可能出错，需要理论、实验或多方独立检查。","points":[],"source":"","state":"研究设计"},{"id":"k096","cat":"limits","title":"最大技术难点：边界位置","short":"边界编号会变，程序容易把载荷或温度加到错误位置。","points":["需要更稳健的几何识别与读回方法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"待突破"},{"id":"k097","cat":"limits","title":"最大科学难点：没有解析解","short":"复杂模型往往不能直接写出准确的解析结果。","points":["要用实验、网格收敛、独立计算与守恒检查组合判断。"],"source":"","state":"待突破"},{"id":"k098","cat":"limits","title":"复合单位可能出什么错","short":"例如 W/(m·K) 这样的单位在提取和换算时更容易出现格式差异。","points":["不能只检查数字，不检查单位。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"待完善"},{"id":"k099","cat":"limits","title":"温度单位有什么坑","short":"摄氏度和开尔文的换算涉及 273.15；温差的换算规则又不同。","points":["必须看参数表示绝对温度还是温差。"],"source":"","state":"原理"},{"id":"k100","cat":"limits","title":"材料参数为什么不能全自动补","short":"不同牌号、温度、工艺和测试条件下，材料性质可能不同。","points":["来源不清的参数应保持为待确认。"],"source":"","state":"研究问题"},{"id":"k101","cat":"limits","title":"真实运行结果和软件测试有何区别","short":"单元测试能检查代码逻辑；只有连接真实 COMSOL 才能验证真实建模过程。","points":["模拟输入通过并不代表求解器已经运行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"原理"},{"id":"k102","cat":"limits","title":"为什么不能说六类模型全部成熟","short":"每类模型的物理条件、许可证、读回要求和验证方式都不同。","points":["需要分别做足量实机实验。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/tool_registry.py","state":"待验证"},{"id":"k103","cat":"limits","title":"复杂多物理场为什么更难","short":"一个物理场的变量可能影响另一个，修改其中一处会改变整套结果。","points":["需要检查耦合关系是否真正建立。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/multiphysics_worker.py","state":"待突破"},{"id":"k104","cat":"limits","title":"导入已有 MPH 的限制","short":"目前不是通用“拖进任意 MPH 就能安全修改”的工具。","points":["源文件要保留，修改需要在受控范围内进行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"待完善"},{"id":"k105","cat":"limits","title":"能不能在所有电脑上直接运行","short":"不能保证。Windows、COMSOL、许可证、Java 桥接和本地模型都可能影响运行。","points":["首次启动要看逐项环境状态。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"待验证"},{"id":"k106","cat":"limits","title":"软件打包的问题还有吗","short":"V2.0 完成了针对性安装与运行修复，但单靠公开源码还不能保证字节完全相同的安装包重建。","points":["内部二进制和部分依赖构建材料另行保存。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/BUILDING.md","state":"有限验证"},{"id":"k107","cat":"limits","title":"只读读回成功等于可以安全修改吗","short":"不等于。读取模型状态和写入物理条件的风险不同。","points":["修改能力要有单独的验收。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"原理"},{"id":"k108","cat":"limits","title":"停止求解是否总能立刻成功","short":"不保证。暂停要等安全位置，部分执行过程可能暂时不可中断。","points":["不能随便强杀其他 COMSOL 进程。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"有边界"},{"id":"k109","cat":"research","title":"适合写论文的核心问题","short":"自动建模结束后，怎样判断模型和结果是否真的符合最初的科学任务。","points":["需要把错误检测方法做成可重复的实验。"],"source":"","state":"研究问题"},{"id":"k110","cat":"research","title":"先做哪一组对照","short":"人工建模、直接生成脚本建模、加入读回和科学验证的工作流。","points":["使用相同任务和相同计算环境。"],"source":"","state":"研究设计"},{"id":"k111","cat":"research","title":"最重要的评价指标","short":"建模正确率、错误检出率、漏报率、误报率和完成时间。","points":["复杂程度与人工修正次数也要记录。"],"source":"","state":"研究设计"},{"id":"k112","cat":"research","title":"错误应该怎么设计","short":"分别制造边界选错、单位错误、材料错误、耦合失效和结果文件混用。","points":["每个错误先由人工确定真实标签。"],"source":"","state":"研究设计"},{"id":"k113","cat":"research","title":"基准模型数量如何确定？","short":"样本应覆盖不同物理场、模型难度、错误类型和重复运行。","points":["样本数量要根据预期误差、统计精度和资源预算确定，不能只靠少量成功样例推断通用性。"],"source":"","state":"研究设计"},{"id":"k114","cat":"research","title":"为什么要保留简单模型","short":"简单模型有理论答案，能先判断检测器是否正确。","points":["复杂模型再用独立高可信参考做检验。"],"source":"","state":"研究设计"},{"id":"k115","cat":"research","title":"为什么要做复杂度分组","short":"二维规则模型和三维复杂装配的错误机会完全不同。","points":["结果应按几何、物理场和模型复杂度分开统计。"],"source":"","state":"研究设计"},{"id":"k116","cat":"research","title":"不同 AI 模型需要比较吗","short":"可以比较，但控制输入任务和其余程序不变。","points":["否则很难判断改进来自模型还是规则。"],"source":"","state":"研究设计"},{"id":"k117","cat":"research","title":"最容易被质疑的创新点","short":"如果只把现有模型调用起来，再添加几条固定检查，科研创新可能不足。","points":["需要证明检查方法具有更广的适用性和新增价值。"],"source":"","state":"研究判断"},{"id":"k118","cat":"research","title":"怎样让创新更扎实","short":"提出可复用的错误类型、检查方法和评价基准，而不只是展示一个软件界面。","points":["最好用实验量化相对已有方法的改进。"],"source":"","state":"研究设计"},{"id":"k119","cat":"research","title":"材料仿真标准案例需要包含哪些数据？","short":"要有模型几何、材料参数、物理边界、研究条件与参考结果。","points":["最好还包括真实的常见错误、网格收敛记录和可复核的计算设置。"],"source":"","state":"研究设计"},{"id":"k120","cat":"research","title":"适合先选的材料场景","short":"温度相关导热系数、热应力或材料扩散中的一个可控小问题。","points":["优先选择已有实验或解析/高精度参考的案例。"],"source":"","state":"研究设计"},{"id":"k121","cat":"research","title":"何时可以把一个方法称为经过系统验证？","short":"要有独立测试样本、明确指标、对照方法和可重复结果。","points":["源代码可运行、少数样例成功或内部测试通过，都不能单独证明通用性。"],"source":"","state":"研究判断"},{"id":"k122","cat":"research","title":"科学验证会不会限制 AI 自由发挥","short":"会限制一部分，但目的是避免未经证实的建模结果被直接采用。","points":["是否值得，需要用准确率和完成率数据比较。"],"source":"","state":"研究问题"},{"id":"k123","cat":"product","title":"桌面程序用了哪些技术","short":"界面使用 React/TypeScript，桌面外壳使用 Rust/Tauri，科学逻辑主要在 Python，另有 Java 桥接。","points":["这只是实现分工，不是独立数值求解器。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"已核对"},{"id":"k124","cat":"product","title":"为什么网页和软件分两个仓库","short":"官网负责公开介绍和文档，桌面仓库负责程序实现。","points":["两者部署和维护可以独立进行。"],"source":"https://github.com/lovesky514514-cmd/scientific-workbench-beta/blob/main/README.md","state":"已核对"},{"id":"k125","cat":"product","title":"当前官网能做什么","short":"查看项目介绍、软件截图、使用文档和源码链接。","points":["当前公开仓库说明官网是静态站点。"],"source":"https://github.com/lovesky514514-cmd/scientific-workbench-beta/blob/main/README.md","state":"已核对"},{"id":"k126","cat":"product","title":"官网有没有开放安装包","short":"没有。当前说明 Windows Setup 仅由获批内部渠道提供。","points":["不能将官网截图当作安装包已公开的证据。"],"source":"https://github.com/lovesky514514-cmd/scientific-workbench-beta/blob/main/README.md","state":"已核对"},{"id":"k127","cat":"product","title":"网站上的截图是不是 V3.0 验收","short":"不是。官网说明截图来自 RC5.1，主要用于展示界面。","points":["不能用旧截图证明 V3.0 的功能验收。"],"source":"https://github.com/lovesky514514-cmd/scientific-workbench-beta/blob/main/README.md","state":"已核对"},{"id":"k128","cat":"product","title":"V2.0 修复了什么","short":"定向修复了冻结运行时的 TLS 与 Bridge 启动问题，并更新了可追溯的 OpenSSL 组件。","points":["修复有针对性，不等于所有工作流全面通过。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/OPENSSL_BUILD_PROVENANCE.md","state":"实机记录"},{"id":"k129","cat":"product","title":"新内部安装包怎样核对","short":"用 SHA-256 检查安装文件是否与已记录的内部候选版本一致。","points":["SHA-256 一致只证明文件身份，不等于物理模型正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"已核对"},{"id":"k130","cat":"product","title":"公开源码能完全复刻安装包吗","short":"目前不能作这样的保证。部分审计过的二进制依赖没有放进公开源码。","points":["源码里已注明独立字节级重建未验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/BUILDING.md","state":"有限验证"},{"id":"k131","cat":"product","title":"这属于官方 COMSOL 产品吗","short":"不是。它是独立第三方工作流助手。","points":["不附带 COMSOL 软件或许可证，也不代表 COMSOL 官方认可。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/COMSOL_DISTRIBUTION_SCOPE.md","state":"已核对"},{"id":"k132","cat":"product","title":"准备公开发行还差什么","short":"需要补齐更多实际运行验证、构建复现、安全检查及许可合规确认。","points":["有内部安装记录并不自动具有公开发行权限。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/BUILDING.md","state":"待完成"},{"id":"k133","cat":"check","title":"运行环境检查包括哪些内容？","short":"检查程序版本、COMSOL 安装与许可证、Java Bridge、本地模型服务及运行时状态。","points":["安装程序能打开，不代表每个物理模块已可用。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"核对项"},{"id":"k134","cat":"check","title":"COMSOL 无法启动时如何定位故障？","short":"先确认安装位置、许可证、进程状态和 Bridge 日志。","points":["没有成功连接 COMSOL 时，不应把历史文件标记为新一次求解的结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"核对项"},{"id":"k135","cat":"check","title":"二维稳态导热最小输入有哪些？","short":"至少包括几何尺寸、导热参数、左右边界温度、其余边界类型和稳态研究。","points":["必须标出单位及材料参数来源。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"核对项"},{"id":"k136","cat":"check","title":"科学计算结果至少应保存哪些证据？","short":"保存输入计划、模型树读回、数值结果、验证指标与运行标识。","points":["MPH 文件、日志和输出图应绑定到同一次运行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"核对项"},{"id":"k137","cat":"check","title":"为什么必须标清建模适用范围？","short":"验证结论只针对明确的方程、几何、材料与边界假设。","points":["例如二维纯导热的成功结果不能直接推广到非线性接触或热应力耦合。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"核对项"},{"id":"k138","cat":"check","title":"遇到尚未覆盖的物理场时怎样处理？","short":"先明确控制方程、材料关系、边界条件与可用验证方法。","points":["没有注册的执行路径或独立验证规则时，应标记为未支持，而不是假定已通过。"],"source":"","state":"核对项"},{"id":"k139","cat":"check","title":"为什么单一基准不能代表所有工作流？","short":"不同物理场对变量、边界、模块许可证和数值检查的要求都不相同。","points":["二维稳态热传导成功，无法证明任意三维多物理场也能可靠运行。"],"source":"","state":"核对项"},{"id":"k140","cat":"check","title":"官网运行正常能证明求解器正常吗？","short":"不能。官网是静态产品文档，不提供在线 COMSOL 求解。","points":["桌面程序、运行时、COMSOL 和模型服务必须分别检测。"],"source":"https://github.com/lovesky514514-cmd/scientific-workbench-beta/blob/main/README.md","state":"核对项"},{"id":"k141","cat":"check","title":"标准建模试验应记录哪些基本信息？","short":"记录模型版本、材料数据、几何与边界、网格、求解器、输出和误差。","points":["每次参数修改后要绑定新的运行记录，确保试验可复核。"],"source":"","state":"研究设计"},{"id":"k0142","cat":"overview","title":"为什么这个项目不是新求解器？","short":"网格、方程和求解仍交给 COMSOL；工作台负责计划、调用和核验。","points":["它没有替代有限元求解器，也不能在没有 COMSOL 许可证时宣称完成真实求解。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0143","cat":"overview","title":"为什么使用受限工作流？","short":"先把少数物理问题做得可检查，再扩展范围。","points":["所有自由输入都能运行听起来方便，但更容易让错误悄悄混进结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0144","cat":"overview","title":"怎样判断产品成熟度？","short":"要分清源码存在、测试通过、本机实测和跨机器验证。","points":["功能可以写在代码里但没有真实许可证；单元测试通过也不等于仿真结论通过。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0145","cat":"overview","title":"SKY Workbench 与普通聊天界面的核心差异是什么？","short":"除任务输入外，它设计了受限执行、模型状态读回和科学验证门控。","points":["这些机制是否能实质降低错误，需要对照实验验证；不能仅凭功能描述推断效果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0146","cat":"overview","title":"和 COMSOL 的 Java API 有何关系？","short":"Java API 是操作接口；工作台是在它外面加了计划审查和结果检查。","points":["接口能修改模型，不自动证明修改后的模型符合研究目的。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0147","cat":"overview","title":"和 MPh 有何关系？","short":"MPh 帮 Python 调用 COMSOL；它是连接手段，不是科学验证方法。","points":["本项目同时涉及 Java Bridge，技术层面需要区分不同执行路径。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0148","cat":"overview","title":"官网为什么单独一个仓库？","short":"官网放介绍和文档，软件主仓库存程序代码。","points":["网页能打开不等于软件可以下载，更不等于后端 COMSOL 正在运行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0149","cat":"overview","title":"源码开源能直接发布安装包吗？","short":"不能直接等同。","points":["安装包还要检查第三方许可证、COMSOL 授权条款、签名、二进制来源和安全性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0150","cat":"overview","title":"和宏录制脚本有什么区别？","short":"宏录制的是固定操作；这里还要检查输入、实际状态和结果。","points":["自动检查的覆盖范围仍限于已定义的工作流。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0151","cat":"overview","title":"怎样确定是否值得研究？","short":"看能不能减少人工疏漏、识别假成功、提高可复现性。","points":["设计基准与指标后才能说明是否优于纯脚本或人工操作。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0152","cat":"overview","title":"项目有什么独立价值？","short":"减少错误结果被误判为完成，是当前明确的工程目标。","points":["研究价值需要跨样例、跨环境的实验证据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0153","cat":"overview","title":"能不能用于生产研发？","short":"现在不能承诺。","points":["复杂模型、批量模型、长期可靠性和部署条件尚缺充分独立验收。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0154","cat":"process","title":"为什么要先生成计划再执行？","short":"先让人看到要建什么，便于发现单位、物理场和边界错误。","points":["不能把一段自然语言未经确认直接转成危险的模型操作。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0155","cat":"process","title":"计划里最要紧的字段是什么？","short":"几何、材料、物理场、参数、边界、网格、研究类型和验证方式。","points":["少一个关键条件，都可能意味着解的不是原来的问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0156","cat":"process","title":"缺失参数怎样处理？","short":"标出缺失，不默默猜数值。","points":["测试基准可以写明假设值，真实材料参数必须有来源或用户确认。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0157","cat":"process","title":"什么是参数来源？","short":"说明数值来自用户、论文、基准还是临时假设。","points":["同样一个导热系数，来源和适用温度范围不同，结论也会不同。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0158","cat":"process","title":"什么时候算完成建模？","short":"模型里的真实设置能读回且与计划一致时，才算完成相应建模核查。","points":["依然不代表求解结果具有科学正确性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0159","cat":"process","title":"为什么记录每次运行编号？","short":"区分这次和上次的数据，防止旧结果混入新任务。","points":["同一模型改过一次参数后就必须重新确认本次结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0160","cat":"process","title":"人工审批是可有可无吗？","short":"关键参数和高风险修改仍需要人工审核。","points":["人工审批不替代后续数值验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0161","cat":"process","title":"中途按暂停就一定立刻停止吗？","short":"不一定。","points":["暂停需要等到允许中断的安全位置，不应假定能在求解器内部任意时刻冻结。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0162","cat":"process","title":"停止后可以无条件继续吗？","short":"不行。","points":["停止结束当前尝试；继续应依赖真实已确认的暂停状态。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0163","cat":"process","title":"重新尝试可以沿用旧验证吗？","short":"不能直接沿用。","points":["修改过边界、材料或研究条件后，应重新求解并生成新的证据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0164","cat":"process","title":"修改一个边界后需要做什么？","short":"读回边界选择与表达式、重新求解、重新检查温度或应力结果。","points":["旧云图只证明旧设置，不证明新设置。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0165","cat":"process","title":"计划检查通过还会失败吗？","short":"会。","points":["模型树写入、许可证、网格、求解器及文件导出都可能失败。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0166","cat":"process","title":"怎样定位失败阶段？","short":"先看失败发生在计划、建模、求解还是科学验证。","points":["不要只看最后一行报错，应保留本次运行记录。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0167","cat":"process","title":"为什么分离读回与求解？","short":"先证明设置正确，再讨论结果是否可信。","points":["否则一个正确的云图可能掩盖错误的边界选择。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0168","cat":"process","title":"运行时关掉软件会怎样？","short":"可能导致任务中断、证据不完整。","points":["不能把未明确结束的运行记为科学验证通过。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0169","cat":"process","title":"结果文件存在就算成功吗？","short":"不算。","points":["文件可能来自旧运行、导出失败的残留或被外部修改。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0170","cat":"process","title":"怎样保存实验过程？","short":"保存输入计划、实际读回、结果摘要、时间和产物校验信息。","points":["必要时另存求解器日志和版本、许可证模块信息。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0171","cat":"process","title":"为何不让 AI 直接循环修到成功？","short":"如果没有规则约束，可能越改越偏离原来的物理问题。","points":["自动修复应限定参数、操作范围和验证重做条件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0172","cat":"ai","title":"什么是自然语言建模的根本难点？","short":"用户一句话不一定包含完整物理问题。","points":["边界条件、材料参数和求解类型往往需要补全并核实。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0173","cat":"ai","title":"LLM 生成 JSON 就算可靠吗？","short":"不算。","points":["格式正确只保证字段能解析，不能保证物理量正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0174","cat":"ai","title":"什么是确定性解析？","short":"按明确规则提取和换算已给的物理量。","points":["例如把 10 cm 转成 0.1 m，并保留原始写法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0175","cat":"ai","title":"为什么不能只依靠大模型？","short":"大模型容易对模糊条件给出看似合理的补全。","points":["真实仿真里，不经确认的“合理猜测”可能造成科学错误。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0176","cat":"ai","title":"没有网络还能建模吗？","short":"部分固定流程可用本地规则形成计划。","points":["具体能否执行还取决于 COMSOL、模型服务和许可证是否就绪。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0177","cat":"ai","title":"没有 Ollama 会怎么样？","short":"本地模型辅助能力可能不可用。","points":["不能把没有连接的模型伪装成已连接。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0178","cat":"ai","title":"RAG 能保证论文参数准确吗？","short":"不能。","points":["检索仅找到候选来源，还要核对原文、单位、测量条件和页码。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0179","cat":"ai","title":"什么是文献引用幻觉？","short":"引用了不存在的论文、页码或把文章不相关的数值当成参数。","points":["对策是保存真实来源并在缺乏证据时留空。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0180","cat":"ai","title":"如何处理互相冲突的文献参数？","short":"并列记录材料状态与实验条件，不随意取平均。","points":["必要时做敏感性分析或让研究者决定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0181","cat":"ai","title":"模型越大一定越好吗？","short":"不一定。","points":["更大的模型可能更会解释问题，但并不保证调用 COMSOL 更稳定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0182","cat":"ai","title":"小模型适合做什么？","short":"做问题分类、初步参数整理和受限的计划辅助。","points":["最终能否执行应由确定性规则、实际读回和科学验证决定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0183","cat":"ai","title":"AI 为什么不能自己认定成功？","short":"因为“成功”必须是可检查的 COMSOL 状态和求解证据。","points":["模型写一段漂亮文字不能替代真实的 MPH 文件和数据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0184","cat":"ai","title":"模型输出了不存在的 COMSOL 节点怎么办？","short":"不执行未知操作，返回计划错误。","points":["不要默认 API 会自动纠正节点名称。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0185","cat":"ai","title":"为什么需要工具白名单？","short":"避免自然语言直接触发任意模型修改。","points":["公开操作应限制在已经注册并审查的流程内。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0186","cat":"ai","title":"如何判断用户的任务属于哪个物理场？","short":"结合显式术语、控制方程、材料和边界信息。","points":["“扩散”可能是热扩散、溶质扩散或固体中的迁移，不能只看关键词。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0187","cat":"ai","title":"能让 AI 自己选择网格密度吗？","short":"可以给建议，但最终需要网格独立性验证。","points":["粗网格求出来的结果并不因为 AI 推荐就可靠。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0188","cat":"ai","title":"AI 可以根据报错自动切换求解器吗？","short":"需要先确认切换不改变科学问题。","points":["把收敛失败强行变成看似成功的解，是危险做法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0189","cat":"ai","title":"什么是计划质量检查？","short":"检查输入是否齐全、逻辑是否矛盾、单位是否合理。","points":["只是执行前检查，不是模型的最终科学认证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0190","cat":"ai","title":"能否自动从论文复现整个模型？","short":"目前不能保证。","points":["论文经常缺少几何细节、边界数值、软件版本和求解器设置。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0191","cat":"ai","title":"材料参数的置信度等于实验可靠性吗？","short":"不等于。","points":["AI 置信度只是机器内部的估计，材料可靠性必须看试验和来源。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/agent/planner.py","state":"知识说明"},{"id":"k0192","cat":"comsol","title":"边界编号为什么会变？","short":"修改几何、布尔运算或重新构建可能改变实体编号。","points":["所以不能长期把“边界 1”认作“左侧”。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0193","cat":"comsol","title":"什么是边界选错了？","short":"载荷或温度设在了不该设的面或边。","points":["求解器仍可能收敛，但结果对应的是另一个物理问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0194","cat":"comsol","title":"什么是几何选择？","short":"按位置、对象或几何特征确定要操作的实体。","points":["规则矩形可以按坐标找边，复杂接触区域需要更稳健的方法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0195","cat":"comsol","title":"怎么检查一个载荷真的生效？","short":"读回载荷特征的类型、选区、表达式和物理场状态。","points":["最好进一步用反力平衡或解析解验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0196","cat":"comsol","title":"Java Bridge 有什么作用？","short":"连接桌面程序与实际 COMSOL 模型，执行受控操作并读取状态。","points":["端口通了不代表正确连接到目标模型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0197","cat":"comsol","title":"为什么需要 Bridge 认证？","short":"防止其他本机程序无意中改动模型。","points":["本机接口也需要限定权限和调用来源。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0198","cat":"comsol","title":"COMSOL 是否必须单独安装？","short":"是。","points":["此程序不附带 COMSOL 或许可证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0199","cat":"comsol","title":"COMSOL 6.3 是永久唯一支持版本吗？","short":"不是未来承诺，只是当前测试与安装条件的明确版本。","points":["其他版本可能 API、模块或模型行为不同，必须另测。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0200","cat":"comsol","title":"COMSOL 核心与模块许可证有什么区别？","short":"核心软件许可不等于拥有所有物理模块。","points":["电池和部分电化学流程需要对应模块许可。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0201","cat":"comsol","title":"发现 MODULE_MISSING 怎么办？","short":"停止该流程并说明缺少模块。","points":["不能用虚假的计算结果代替真实求解。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0202","cat":"comsol","title":"为什么要分离 COMSOL 进程？","short":"减少长期会话的模型串扰和资源残留风险。","points":["每个受控任务独立启动需要更多开销，但可能更稳。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0203","cat":"comsol","title":"MPh 客户端和 Java API 是否一回事？","short":"不是。","points":["MPh 是 Python 侧的连接方式，底层可访问 COMSOL 的 Java 模型对象。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0204","cat":"comsol","title":"什么是 MPH 文件？","short":"COMSOL 模型文件。","points":["有 MPH 文件不代表文件内的模型一定正确或求解完成。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0205","cat":"comsol","title":"能导入别人做的 MPH 就随便修改吗？","short":"不能。","points":["当前仅有受限的导入与预览能力，通用任意修改尚未完整验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0206","cat":"comsol","title":"怎样避免覆盖原始模型？","short":"在副本操作，保留输入文件的哈希和路径。","points":["每次修改后独立保存新产物。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0207","cat":"comsol","title":"模型树里该看什么？","short":"几何、材料、物理场、边界、网格、研究和结果节点。","points":["只有这些层级都存在并不够，还需核对具体设置。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0208","cat":"comsol","title":"COMSOL API 返回 200 意味着什么？","short":"接口调用成功。","points":["不代表边界条件生效、数值解正确或输出证据齐全。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0209","cat":"comsol","title":"为什么不直接用鼠标自动操作 GUI？","short":"GUI 位置容易受版本、窗口和语言影响。","points":["API 更方便做读回和自动验证，但也有接口兼容风险。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0210","cat":"comsol","title":"网格生成成功就是模型成功吗？","short":"不是。","points":["网格还可能过粗、畸变，甚至没有覆盖预期物理区域。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0211","cat":"comsol","title":"为什么同一模型重跑结果会不同？","short":"可能与网格、求解器、初值、并行设置和版本有关。","points":["必须保存环境和求解配置才能定位原因。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0212","cat":"heat","title":"稳态和瞬态热传导的区别？","short":"稳态温度不再随时间改变；瞬态温度随时间演变。","points":["稳态常写 ∇·(k∇T)+Q=0；瞬态还含 ρCp ∂T/∂t。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0213","cat":"heat","title":"什么情况下温度是直线分布？","short":"一维、稳态、无热源、常导热系数的条件下。","points":["若 k 随温度变化或内部生热，温度一般不再是直线。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0214","cat":"heat","title":"热流密度是什么？","short":"单位面积上的热量传递速率，单位 W/m²。","points":["傅里叶定律 q=-k∇T；负号说明热从高温流向低温。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0215","cat":"heat","title":"为什么上下绝热？","short":"把二维矩形问题简化为沿长度方向的一维传热。","points":["上下绝热表示法向热流为零，不表示温度为零。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0216","cat":"heat","title":"恒温边界和绝热边界可以同时用在同一个边吗？","short":"对同一物理接口的同一区域一般不能设互相矛盾的条件。","points":["必须确认边界条件优先级和物理含义。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0217","cat":"heat","title":"为什么用开尔文 K？","short":"绝对温度便于统一运算和物性表达。","points":["摄氏温差与开尔文温差数值相同，绝对温度必须正确换算。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0218","cat":"heat","title":"373 K 等于多少摄氏度？","short":"99.85 ℃。","points":["计算方法是摄氏温度=开尔文温度-273.15。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0219","cat":"heat","title":"传热系数和导热系数是一回事吗？","short":"不是。","points":["导热系数 k 单位 W/(m·K)；对流换热系数 h 单位 W/(m²·K)。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0220","cat":"heat","title":"为什么同一稳态温度图可能对 k 不敏感？","short":"常数 k、无内热源、两端给定温度时，解析温度分布不依赖 k。","points":["热流大小仍依赖 k，因此要同时验证热流。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0221","cat":"heat","title":"材料的密度和热容影响稳态吗？","short":"简单纯导热稳态通常不直接决定温度分布。","points":["在瞬态热传导中，ρCp 决定热惯性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0222","cat":"heat","title":"为什么热传导温度可能超出两侧给定温度？","short":"可能有内热源、其他边界作用、材料非线性或数值错误。","points":["在无源、恒定 k 的简单基准中出现明显越界需要排查。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0223","cat":"heat","title":"如何计算热传导解析解？","short":"T(x)=T左+(T右-T左)x/L。","points":["仅适用于相应的一维稳态无源常系数假设。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0224","cat":"heat","title":"如何计算温度 RMSE？","short":"把数值温度与解析温度逐点相减、平方求平均再开方。","points":["RMSE 越小表示在采样点上越接近参考解；还需要说明采样方式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0225","cat":"heat","title":"为什么 RMSE 小不代表模型完全正确？","short":"若解析解和模型共享错误假设，两者可能同时错。","points":["还需要检查材料、边界及与真实实验的一致性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0226","cat":"heat","title":"热传导的无量纲数傅里叶数是什么？","short":"Fo=αt/L²。","points":["描述热扩散时间相对几何尺度的大小，α=k/(ρCp)。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0227","cat":"heat","title":"毕渥数 Bi 代表什么？","short":"Bi=hL_c/k。","points":["比较内部导热阻力与表面对流换热阻力，常用于判断集总参数法适用性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0228","cat":"heat","title":"热扩散率是什么？","short":"α=k/(ρCp)，单位 m²/s。","points":["反映温度变化在材料中传播得快不快。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0229","cat":"heat","title":"为什么金属温度变化一般比隔热材料快？","short":"常因导热和热扩散特性不同。","points":["不能只看导热系数，也应看密度与比热。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0230","cat":"heat","title":"怎样检查稳态能量守恒？","short":"无内热源时，进入区域的净热流与离开区域的热流应平衡。","points":["比较边界积分热流，不只看温度彩图。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0231","cat":"heat","title":"什么是接触热阻？","short":"两材料接触处存在额外温度降。","points":["真实界面可能不连续，不能默认完美热接触。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0232","cat":"heat","title":"为什么热传导模型要做网格独立性？","short":"排除结果主要由网格粗细决定。","points":["至少比较几组网格对关键温度、热流和误差的影响。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0233","cat":"heat","title":"为什么热边界识别用温度标记有风险？","short":"它依赖特定几何、临时求解和能够辨识的温度场。","points":["复杂几何和高对称结构可能导致识别不唯一。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0234","cat":"heat","title":"导热系数是负数能建模吗？","short":"普通被动导热材料通常要求正导热系数。","points":["负值可能来自单位、解析或数据输入错误，应暂停核实。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0235","cat":"heat","title":"瞬态问题中初始温度重要吗？","short":"重要。","points":["不同初值会影响升温过程，即使最终稳态相同。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0236","cat":"heat","title":"有辐射时还适合用线性解析解吗？","short":"一般不适合直接套用。","points":["辐射边界常含 T⁴，属于非线性边界条件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0237","cat":"heat","title":"为什么会出现热传导求解不收敛？","short":"可能是材料参数非法、边界条件不完整、非线性太强或网格问题。","points":["先看报错和残差，再改设置。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/comsol/heat_worker.py","state":"知识说明"},{"id":"k0238","cat":"physics","title":"TDS 是什么？","short":"稀物质传递接口，用于模拟浓度、扩散和可能的对流、反应。","points":["当前受限基准主要是稳态纯扩散，不是所有传质问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0239","cat":"physics","title":"菲克第一定律是什么？","short":"扩散通量 J=-D∇c。","points":["物质通常从高浓度向低浓度扩散。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0240","cat":"physics","title":"稳态纯扩散控制方程是什么？","short":"D 为常数且无源时可写 ∇·(D∇c)=0。","points":["一维两端定浓度时，浓度通常线性变化。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0241","cat":"physics","title":"D 的单位是什么？","short":"m²/s。","points":["不要把 m²/s 和 mm²/s 直接混用。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0242","cat":"physics","title":"什么时候需要对流项？","short":"当流体运动带走物质时。","points":["只有纯扩散条件下才可把速度设为零。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0243","cat":"physics","title":"什么是无通量边界？","short":"该边界法向净传质通量为零。","points":["它不同于浓度为零，也不同于任意绝对不透过情形。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0244","cat":"physics","title":"什么是质量守恒？","short":"没有反应和积累时，进入与离开的物质量应平衡。","points":["边界通量积分是重要检查量。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0245","cat":"physics","title":"什么是皮克莱数 Pe？","short":"Pe=UL/D。","points":["比较对流输运与扩散输运的重要性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0246","cat":"physics","title":"什么时候 TDS 不能用纯扩散模型？","short":"存在显著流速、电迁移、化学反应或复杂多组分作用时。","points":["必须根据物理问题启用相应机制和接口。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0247","cat":"physics","title":"固体力学中的应力是什么？","short":"单位面积上的内部作用力，常用 Pa。","points":["拉应力与剪应力方向及定义不同。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0248","cat":"physics","title":"应变是什么？","short":"长度相对变化，无量纲。","points":["小变形拉伸可近似 ε=ΔL/L。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0249","cat":"physics","title":"杨氏模量有什么意义？","short":"在线弹性范围内，描述材料抵抗拉伸变形的能力。","points":["简单单轴关系 σ=Eε。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0250","cat":"physics","title":"泊松比是什么？","short":"材料轴向拉伸时横向收缩的比例。","points":["一般均匀各向同性线弹性材料需要符合稳定性约束。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0251","cat":"physics","title":"为什么需要固定端？","short":"消除刚体位移，使静力问题具有可求解的约束。","points":["固定过多会制造不真实的附加应力。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0252","cat":"physics","title":"边界载荷和集中力有什么区别？","short":"边界载荷分布在面积上；集中力是理想化作用在点或线上的力。","points":["两者需要正确换算总力和局部应力。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0253","cat":"physics","title":"单轴拉伸位移怎么估算？","short":"ΔL=FL/(EA)，或按端面均匀应力 ΔL=σL/E。","points":["适用于杆件线弹性、小变形等前提。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0254","cat":"physics","title":"什么是冯·米塞斯应力？","short":"由应力状态组合得到的等效应力，常用于延性材料屈服判断。","points":["它不是每个方向的实际正应力。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0255","cat":"physics","title":"为什么固定端附近应力可能很高？","short":"边界约束和几何不连续造成应力集中。","points":["要区分真实物理集中和数值奇异性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0256","cat":"physics","title":"什么是力平衡？","short":"静力条件下外载荷与支座反力应平衡。","points":["不平衡可能说明载荷方向、选区或求解设置有问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0257","cat":"physics","title":"什么是线弹性？","short":"卸载可恢复，且应力和应变近似成线性关系。","points":["塑性、损伤、蠕变需要其他本构模型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0258","cat":"physics","title":"什么是弹塑性？","short":"应力达到屈服条件后，材料出现不可完全恢复的变形。","points":["不能继续用简单 σ=Eε 描述全程。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0259","cat":"physics","title":"电化学中的电流密度是什么？","short":"单位面积上的电流，单位 A/m²。","points":["电流方向、边界符号和总电流积分都需要检查。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0260","cat":"physics","title":"一次电流分布是什么意思？","short":"主要考虑电解质导电和电势分布，忽略电极反应动力学引起的电荷转移限制。","points":["不等于所有电化学过程。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0261","cat":"physics","title":"二次电流分布和一次有什么区别？","short":"二次电流分布额外考虑电极反应动力学。","points":["仍不一定包含浓度变化与传质限制。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0262","cat":"physics","title":"三次电流分布增加了什么？","short":"进一步考虑物质传递引起的浓度变化。","points":["建模条件更复杂，通常需更多参数和验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0263","cat":"physics","title":"电池模型最难的地方是什么？","short":"多区域、多组分、多时间尺度和耦合参数。","points":["必须核对材料、接口、初态、边界以及模块许可证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0264","cat":"physics","title":"SOC 是什么？","short":"电池荷电状态，表示剩余可用容量的相对程度。","points":["不同电化学模型里的变量定义可能不同。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0265","cat":"physics","title":"为什么电池电压合理也不等于模型正确？","short":"多组错误参数可能巧合得到近似电压。","points":["还要对比浓度、守恒、电流和随时间变化方向。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0266","cat":"physics","title":"什么是单向耦合？","short":"一个物理场影响另一个物理场，后者不反过来改变前者。","points":["例如温度影响扩散系数但浓度不改变温度方程。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0267","cat":"physics","title":"什么是双向耦合？","short":"两个物理场相互影响，需要同时或迭代一致求解。","points":["不等同于简单依次运行两个互不影响的模型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0268","cat":"physics","title":"为什么要做耦合开关对照？","short":"检查开启耦合后结果是否发生符合物理的变化。","points":["如果耦合表达式没生效，开关前后可能几乎一样。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0269","cat":"physics","title":"耦合结果相同说明一定没耦合吗？","short":"不一定。","points":["耦合参数极小、温度近似恒定时，真实耦合影响也可能很弱。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0270","cat":"physics","title":"耦合变量引用错了会怎样？","short":"可能读到不存在变量、常量或错误组件的值。","points":["要读回表达式并检查变量真正参与方程。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0271","cat":"physics","title":"为什么复杂耦合要校验单位？","short":"不同场之间共享的变量可能量纲不一致。","points":["例如温度 K 与扩散系数 m²/s 不能直接相加。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0272","cat":"physics","title":"什么是材料各向异性？","short":"材料性质随方向变化。","points":["导热或弹性参数可能需要张量而不是单个数值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0273","cat":"physics","title":"什么是非线性材料？","short":"材料响应不再与输入量成简单正比。","points":["比如温度依赖导热、塑性或非线性应变。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0274","cat":"proof","title":"命令成功等于模型正确吗？","short":"不等于。","points":["成功只说明某次操作按接口返回，参数及边界仍需读回。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0275","cat":"proof","title":"模型读回通过等于科学正确吗？","short":"不等于。","points":["读回证明设置与计划吻合，计划本身也可能不符合真实科学问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0276","cat":"proof","title":"什么是科学验证？","short":"用解析解、守恒关系、边界值、数值稳定性或实验数据检查结果。","points":["不同物理场必须选择适合的检查方式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0277","cat":"proof","title":"证据合同是什么意思？","short":"约定哪些记录齐全才允许把本次结果标记为通过。","points":["包括运行编号、模型状态、数据和文件完整性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0278","cat":"proof","title":"为何要核对文件 SHA-256？","short":"发现文件是否在验证后被替换或修改。","points":["哈希证明内容一致，不证明物理模型一定正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0279","cat":"proof","title":"为什么要有 attempt_id？","short":"区分同一任务的不同尝试。","points":["旧运行的图不能证明新尝试的结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0280","cat":"proof","title":"为什么结果要绑定 run_id？","short":"避免一个任务引用另一个任务的文件。","points":["防止目录碰撞、缓存残留和证据串用。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0281","cat":"proof","title":"什么是独立验证？","short":"验证逻辑不只相信执行模块自己报告的成功。","points":["最好对读取出来的数值重新计算误差和物理约束。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0282","cat":"proof","title":"验证阈值如何选？","short":"依据解析误差、数值离散误差、测量误差和任务容忍度确定。","points":["不能为了让测试通过而随意放宽。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0283","cat":"proof","title":"有解析解就完全不用实验验证吗？","short":"不是。","points":["解析解可以验证数值实现，真实材料参数和边界条件仍需要实验依据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0284","cat":"proof","title":"网格收敛和求解器收敛是一回事吗？","short":"不是。","points":["求解器收敛说明方程迭代满足停止条件；网格收敛看网格细化后结果是否稳定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0285","cat":"proof","title":"数值残差很小是否等于物理误差很小？","short":"不一定。","points":["残差小可能只说明离散方程解得好，但离散本身存在误差。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0286","cat":"proof","title":"如何做网格独立性？","short":"固定物理参数，只改网格，比较关键输出随网格细化是否趋于稳定。","points":["记录网格数、计算时间和误差。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0287","cat":"proof","title":"验证一个复杂应力峰值要注意什么？","short":"尖角、点载荷和固定约束可能导致网格越细应力越高。","points":["不能直接把局部最大值当作可收敛指标。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0288","cat":"proof","title":"如何区分模型错误和数值误差？","short":"先核对物理设置，再研究网格、收敛和求解器。","points":["两类错误可以同时存在。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0289","cat":"proof","title":"实验数据和仿真差很多怎么办？","short":"先核实试样、材料状态、边界、单位和测量误差。","points":["不要只通过调参数把曲线强行拟合。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0290","cat":"proof","title":"什么叫错误注入？","short":"人为把边界、单位、材料等设置改错，检查系统能否发现。","points":["科研评估中需要保存每个错误的真实标签。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0291","cat":"proof","title":"错误检测的召回率怎么算？","short":"真正被检测到的错误数/所有真实错误数。","points":["越高表示漏掉的错误越少。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0292","cat":"proof","title":"误报率是什么意思？","short":"正确任务被错误地判为失败的比例。","points":["安全门槛过严可能导致正常任务经常被阻止。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0293","cat":"proof","title":"准确率高能证明检测系统好吗？","short":"不一定。","points":["如果错误样本很少，只报全对也会有很高准确率。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0294","cat":"proof","title":"如何验证流程可复现？","short":"保存模型、输入、软件版本、网格和运行证据，在独立环境重跑并对比关键量。","points":["字节级可复现比科学结果可复现要求更严。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0295","cat":"proof","title":"能否根据图像判断所有物理结论？","short":"不能。","points":["云图只显示某一种结果，需要检查数值、变量和单位。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0296","cat":"proof","title":"温度云图颜色漂亮说明什么？","short":"只说明图像显示效果。","points":["颜色条范围可能自动缩放，不能代替实际数值验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0297","cat":"proof","title":"为什么证据会失效？","short":"修改了模型参数、删除文件或切换运行后，旧证据不再对应当前状态。","points":["应重新读回和重做必要计算。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0298","cat":"proof","title":"校验哈希需要联网吗？","short":"不需要。","points":["本地对文件字节计算 SHA-256 即可。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0299","cat":"proof","title":"如何证明真的调用 COMSOL 而不是画了假图？","short":"保留真实运行日志、模型读回、可打开的 MPH 文件和当前数值结果。","points":["最好由其他人独立重复关键步骤。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0300","cat":"proof","title":"怎样证明选区生效？","short":"读回实体选区、物理条件表达式，再比较边界场或力/热量平衡。","points":["只看到边界对象存在还不够。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0301","cat":"proof","title":"什么是物理量量纲检查？","short":"检查等式两侧和每项的单位是否一致。","points":["量纲正确只是必要条件，不足以保证方程正确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0302","cat":"proof","title":"不同电脑产生一点差异需要判失败吗？","short":"看差异是否超过经论证的数值容差。","points":["求解器版本和浮点运算可能引入细微变化。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0303","cat":"proof","title":"什么时候需要宣布无法验证？","short":"证据缺失、模型读取失败、超出支持范围或物理检查未通过时。","points":["“无法验证”和“已证明错误”是不同的结论。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/execution_verdict.py","state":"知识说明"},{"id":"k0304","cat":"limits","title":"最担心的隐蔽错误是什么？","short":"模型能算出好看的图，但边界、材料或单位与需求不一致。","points":["这种错误可能不触发软件报错。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0305","cat":"limits","title":"为什么严格门控会降低通过率？","short":"有些真实正确的结果因为缺少证据也会被拒绝。","points":["需要区分不正确和证据不足。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0306","cat":"limits","title":"怎么提高验证覆盖率而不放松安全？","short":"针对常见物理场补充可复核的读回和参考检查。","points":["不要简单取消验收条件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0307","cat":"limits","title":"复杂几何选区为什么难？","short":"局部面与边可能数量多、相邻关系复杂且编号易变。","points":["需要考虑几何特征与稳定的对象引用。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0308","cat":"limits","title":"COMSOL 版本升级有什么风险？","short":"API 类型、默认设置、物理接口特征和求解器行为可能变。","points":["应按版本重新跑真实基准测试。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0309","cat":"limits","title":"本机跑通为何不能代表别人的机器？","short":"安装位置、许可证、依赖版本和显卡等环境不同。","points":["需要全新机器的安装和科学运行验收。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0310","cat":"limits","title":"能不能声称所有物理场都能用？","short":"不能。","points":["现在实现的是六类有限工作流，真实验证覆盖范围还要逐项说明。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0311","cat":"limits","title":"能不能承诺自动修复所有错误？","short":"不能。","points":["复杂材料和无解析解问题往往需要专家判断。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0312","cat":"limits","title":"导入任意 MPH 是否已经成熟？","short":"没有。","points":["导入、预览与安全修改任意模型是不同能力。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0313","cat":"limits","title":"为什么不能只测单元测试？","short":"单元测试往往使用模拟输入，不一定启动真实 COMSOL。","points":["需单独保留真实软件的端到端测试证据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0314","cat":"limits","title":"接口权限错误可能造成什么？","short":"未经授权的本机程序可能读取或修改项目。","points":["必须有本地认证、受控路由和操作范围限制。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0315","cat":"limits","title":"为什么要重视 Python 打包环境？","short":"打包后可能缺 DLL、证书、环境变量或动态库。","points":["源码可运行不代表安装版也能运行。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0316","cat":"limits","title":"OpenSSL 修复说明了什么？","short":"冻结运行环境与网络/桥接连接存在独立的工程风险。","points":["更新依赖只能说明已修复相应问题，不证明所有物理场通过。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0317","cat":"limits","title":"为什么安装成功不代表科学验证成功？","short":"安装只验证程序能够部署和启动。","points":["真实许可证、桥接、模型读回和求解都属于另一层验收。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0318","cat":"limits","title":"网上的项目截图能当验证报告吗？","short":"不能。","points":["历史 UI 截图仅证明当时的界面状态。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0319","cat":"limits","title":"软件能不能在没有许可证时运行？","short":"界面可能可以启动，真实 COMSOL 求解不可以。","points":["应该明确报告缺少 COMSOL 而非伪造结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0320","cat":"limits","title":"当前建模能力的主要边界是什么？","short":"复杂几何的选区、非线性材料和通用多物理场验证仍存在限制。","points":["已注册工作流不等于已经完成跨机器、跨任务的全面实机验收。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0321","cat":"limits","title":"用不同硬件是否一定会数值发散？","short":"不一定。","points":["差异可能只有很小的浮点误差，具体取决于求解方式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0322","cat":"limits","title":"科学验证是否能完全消灭错误？","short":"不能。","points":["验证只能覆盖已定义的假设、指标与证据类型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0323","cat":"research","title":"能拿什么做第一个研究课题？","short":"选自动边界识别错误检测或科学证据完整性评价。","points":["先缩小问题并做严格基准，比做“大而全平台”更容易验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0324","cat":"research","title":"论文中的创新点能只写软件集成吗？","short":"通常不够。","points":["更有说服力的是新方法、明确理论或比现有方法显著改进的数据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0325","cat":"research","title":"什么是合适的基准实验？","short":"同样模型、相同输入、相同评价规则下比较不同系统。","points":["要有手工 COMSOL、普通脚本或直接 AI 方案作为对照。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0326","cat":"research","title":"如何设计错误注入类型？","short":"单位错、边界错、材料错、研究类型错、旧证据串用、模块缺失。","points":["每种错误都需要清晰的真值标签。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0327","cat":"research","title":"哪些指标能体现系统价值？","short":"错误检出率、漏检率、误报率、成功率、时间和人工干预次数。","points":["还要报告模型复杂度和样本数量。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0328","cat":"research","title":"如何避免用简单案例证明通用性？","short":"把验证模型按维度、物理场、几何复杂度和非线性程度分层。","points":["明确哪些结果只适用于当前受限范围。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0329","cat":"research","title":"为什么需要盲测？","short":"防止调规则时无意针对测试题优化。","points":["保留未参与开发的数据集和错误实例。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0330","cat":"research","title":"怎样做消融实验？","short":"分别移除边界读回、物理校验、单位检查等模块比较效果。","points":["能量化每个检查模块的实际贡献。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0331","cat":"research","title":"高质量仿真基准数据应有哪些部分？","short":"输入模型、可信参考结果、错误样本、环境版本和统一评价标准。","points":["真实材料数据与物理检查规则能帮助衡量错误检测是否有效。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0332","cat":"research","title":"如何设计复杂几何验证任务？","short":"从带孔板、阶梯杆、多材料界面逐步增加难度。","points":["选择特征必须能与真实几何标签对应。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0333","cat":"research","title":"哪些材料问题适合后续扩展？","short":"导热、热应力、扩散、界面接触和温度依赖物性。","points":["从有参考解的小规模模型起步。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0334","cat":"research","title":"怎样验证系统比人工更好？","short":"同一任务集设置统一时间限制和验收标准，记录人员经验。","points":["不能只比较速度而忽略科学错误。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0335","cat":"research","title":"如何把参数追溯变成研究问题？","short":"测量系统能否发现引用错误、单位错误和适用范围冲突。","points":["建立带来源和错误标签的参数数据集。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0336","cat":"research","title":"要不要直接追求全自动？","short":"先实现关键阶段可审查、可中止和可恢复。","points":["全自动不是质量指标，尤其在高风险科学建模中。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0337","cat":"research","title":"科研成果最小可发表单位是什么？","short":"一个定义清楚的错误类型、一种可重复检测方法和足够强的对照实验。","points":["是否能发表取决于新颖性与结果，不是软件规模。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0338","cat":"research","title":"怎样防止实验结论挑样本？","short":"预先固定测试集、指标、失败处理和阈值。","points":["完整报告成功与失败案例。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0339","cat":"research","title":"模型结果缺少解析解怎么办？","short":"可用守恒检验、网格收敛、独立参考计算或实验数据。","points":["多种验证互补，不能只靠一种指标。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0340","cat":"research","title":"如何评估异常恢复效果？","short":"统计失败后是否保留原模型、是否及时阻止错误结果、是否产生新证据。","points":["成功重试也应记录代价。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0341","cat":"research","title":"怎样用实验判断一种验证方法是否有效？","short":"比较有无验证门控时的错误检出率、误报率和计算成本。","points":["需要固定测试集、明确错误标签，报告重复运行的差异。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0342","cat":"research","title":"论文结果表该怎么做？","short":"列出任务类别、样本数、检出率、误报率、运行时间与置信区间。","points":["同时提供典型正确和失败案例。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/README.md","state":"知识说明"},{"id":"k0343","cat":"product","title":"网页是在线求解服务吗？","short":"不是。","points":["当前官网是 GitHub Pages 静态介绍与文档页面。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0344","cat":"product","title":"V3.0 是否提供公开安装包？","short":"目前没有。","points":["公开的是净化源码，Windows Setup 仍属于内部候选版。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0345","cat":"product","title":"为什么安装包需要 SHA-256？","short":"方便核对本地文件是否与指定候选版一致。","points":["不代表文件已经获得公开发布授权。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0346","cat":"product","title":"源码和安装程序完全可复现了吗？","short":"尚未证明第三方可只凭公开源码构建出完全相同的安装程序。","points":["部分编译二进制输入与构建证据单独保存。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0347","cat":"product","title":"是否包含 COMSOL 的安装文件？","short":"不包含。","points":["真实使用需要用户自行安装合法版本并取得许可证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0348","cat":"product","title":"为什么桌面用 Tauri？","short":"提供本地桌面外壳和资源管理。","points":["真正 COMSOL 科学计算仍由 Python/Java 桥接的运行环境完成。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0349","cat":"product","title":"为什么前端使用 React？","short":"便于管理任务、计划、状态和证据界面。","points":["它不参与有限元方程求解。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0350","cat":"product","title":"为什么 Python 用于后端？","short":"便于编排模型、科学计算和验证数据。","points":["执行 COMSOL 仍需要真实 API 与许可证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0351","cat":"product","title":"为什么有单独 Java Bridge？","short":"便于受控调用和读回 COMSOL 模型。","points":["应有本地认证并限制可修改范围。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0352","cat":"product","title":"官网截图是否一定来自 V3.0？","short":"不是。","points":["官网明确标注部分界面截图来自旧 RC5.1，不能当成 V3.0 结果证据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0353","cat":"product","title":"开源协议与官网版权一致吗？","short":"两个仓库授权范围不同。","points":["主仓库一方代码采用 Apache-2.0；网站原创内容另有版权声明，应看各自文件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/INSTALL_WINDOWS.md","state":"知识说明"},{"id":"k0354","cat":"check","title":"桌面程序启动后应检查哪些状态？","short":"检查软件版本、科学运行时、COMSOL 许可证和 Bridge 连接。","points":["每项状态应独立显示，不应根据桌面窗口正常打开推断求解可用。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0355","cat":"check","title":"执行一次仿真应保留哪些产物？","short":"模型文件、数值结果、求解日志、模型状态读回和科学验证报告。","points":["通过校验大小及 SHA-256 可识别文件是否丢失或被改动。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0356","cat":"check","title":"COMSOL 启动失败有哪些常见原因？","short":"许可证不可用、运行环境不匹配、Java Bridge 未连接或进程异常。","points":["应核对错误日志与组件状态，不要用缓存结果冒充本次计算。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0357","cat":"check","title":"修改边界温度后原来的验证还有效吗？","short":"对受影响的科学结论通常不再有效。","points":["应重新读回表达式、重新求解并记录新一次的温度场验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{
