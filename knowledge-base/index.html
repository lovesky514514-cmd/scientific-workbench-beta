"id":"k0358","cat":"check","title":"更换复杂几何会影响哪些建模环节？","short":"可能改变边界编号、实体选择、网格质量和验证基准。","points":["必须重新核对几何拓扑与边界映射，不能照搬旧模型的实体编号。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0359","cat":"check","title":"外部 MPH 文件能否直接自动修改？","short":"当前版本尚未完整支持任意 MPH 的通用导入与修改。","points":["应保留原文件，在副本上做受控更改，并对新结果重新验证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0360","cat":"check","title":"为什么代码测试数量不等于真实仿真实验数量？","short":"单元测试可能使用模拟对象或构造数据，并没有实际启动 COMSOL。","points":["实机实验数应按有原始日志、模型文件和可复核证据的运行单独统计。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0361","cat":"check","title":"可复现的仿真方法研究需要哪些证据？","short":"需要可获得的输入、固定版本、对照方案、指标和重复实验结果。","points":["关键对比应覆盖成功与失败样本，而非只选对自己有利的案例。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0362","cat":"check","title":"不同建模工具的性能应该如何比较？","short":"在相同任务、输入条件和硬件上比较正确率、错误漏检率与执行成本。","points":["没有严格对照数据，不能断言某个工具整体更优。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0363","cat":"check","title":"失败实验记录有哪些技术价值？","short":"能定位模型读回、依赖库、Bridge 启动及证据检查中缺失的约束。","points":["失败应附对应触发条件、日志和修复后复测结果，避免重复发生。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/USER_GUIDE.md","state":"知识说明"},{"id":"k0364","cat":"units","title":"1 mm 等于多少 m？","short":"0.001 m。","points":["长度输入时必须明确单位，毫米转米乘 10⁻³。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0365","cat":"units","title":"1 MPa 等于多少 Pa？","short":"1,000,000 Pa。","points":["应力、模量和载荷量纲容易混淆。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0366","cat":"units","title":"1 GPa 等于多少 Pa？","short":"10⁹ Pa。","points":["例如 70 GPa 等于 7×10¹⁰ Pa。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0367","cat":"units","title":"1 W/(m·K) 表示什么？","short":"导热系数单位。","points":["长度方向上每米温差对应的传热能力。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0368","cat":"units","title":"热容 Cp 和热导率 k 有什么区别？","short":"Cp 是单位质量升温所需热量；k 是传热能力。","points":["Cp 常用 J/(kg·K)，k 常用 W/(m·K)。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0369","cat":"units","title":"密度 2700 kg/m³ 代表什么？","short":"1 立方米这种材料约有 2700 kg 质量。","points":["这只是特定材料示例，真实模型应按材料来源确定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0370","cat":"units","title":"70 GPa 的 E 输入成 70 Pa 会怎样？","short":"刚度相差十亿倍。","points":["位移可能离谱，但求解器未必直接报错。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0371","cat":"units","title":"1 mm²/s 转成 m²/s 是多少？","short":"10⁻⁶ m²/s。","points":["扩散系数换算尤其要小心平方单位。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0372","cat":"units","title":"为何 N/mm² 等于 MPa？","short":"因为 1 N/mm² = 10⁶ N/m² = 1 MPa。","points":["这在固体力学工程数据中很常见。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0373","cat":"units","title":"给定力 N 和压力 Pa 如何换算？","short":"均匀受力时压力=力/面积。","points":["必须使用真实受力面积，不能直接把 N 当 Pa。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0374","cat":"units","title":"如何判断热流单位？","short":"总热功率是 W；热流密度是 W/m²。","points":["积分前后单位应发生对应变化。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0375","cat":"units","title":"怎么理解 K 与 ℃ 的区别？","short":"绝对温度 K=℃+273.15，温差 1 K 等于温差 1 ℃。","points":["材料公式若含温度比值通常要用绝对温度。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0376","cat":"units","title":"热扩散率 m²/s 和扩散系数 m²/s 是一样物理量吗？","short":"单位相同，物理含义不同。","points":["前者描述热传播，后者描述物质迁移。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0377","cat":"units","title":"导热系数 k(T) 随温度变化怎么处理？","short":"使用经过确认的函数或材料模型。","points":["同时检查参数适用温区，不能简单固定为室温值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0378","cat":"units","title":"科学记数法 1e-6 是什么？","short":"1×10⁻⁶，即 0.000001。","points":["写入 JSON 或 COMSOL 参数时要检查正负号和指数。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0379","cat":"units","title":"一个参数没有单位还能直接执行吗？","short":"除确实无量纲的参数外，不应直接接受。","points":["需要明确物理量和标准单位。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0380","cat":"units","title":"为什么参数不能只保存归一化值？","short":"原值与原单位能帮助排查转换错误。","points":["例如 20 mm 转成 0.02 m，最好同时保留两份信息。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0381","cat":"units","title":"什么是量纲齐次？","short":"公式各项单位必须相容。","points":["如 1 m + 1 s 没有明确物理意义。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0382","cat":"units","title":"几何尺寸负数会怎样？","short":"多数常规尺寸必须为正。","points":["负坐标可以表示位置，但负长度应拒绝或确认。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0383","cat":"units","title":"泊松比 0.49 意味着什么？","short":"接近不可压缩的材料响应。","points":["可能增加数值求解难度，具体取决于单元和材料模型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/quantity.py","state":"原理参考"},{"id":"k0384","cat":"numerics","title":"有限元法是什么？","short":"把连续区域划成小单元，在单元上近似求解方程。","points":["网格和形函数决定离散精度与计算规模。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0385","cat":"numerics","title":"为什么网格越细通常越慢？","short":"单元数和未知量增多。","points":["计算时间和内存通常随自由度上升。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0386","cat":"numerics","title":"自由度 DOF 是什么？","short":"求解器需要确定的独立未知量数量。","points":["不是简单等于网格节点数，取决于变量和单元阶次。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0387","cat":"numerics","title":"残差是什么？","short":"代入当前近似解后，离散方程还剩多少不平衡。","points":["残差下降并不自动说明网格误差也下降。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0388","cat":"numerics","title":"相对容差是什么？","short":"依据问题尺度判断迭代误差是否足够小的阈值。","points":["不能只调大容差掩盖不收敛。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0389","cat":"numerics","title":"绝对容差和相对容差区别？","short":"绝对容差针对实际误差大小；相对容差相对于变量尺度。","points":["小量变量通常更需要关注绝对容差。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0390","cat":"numerics","title":"直接求解器和迭代求解器区别？","short":"直接法通过矩阵分解求解；迭代法逐步逼近。","points":["直接法可能更耗内存，迭代法依赖预条件等设置。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0391","cat":"numerics","title":"什么是条件数？","short":"反映输入微小变化可能被放大多少。","points":["病态系统可能对舍入误差非常敏感。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0392","cat":"numerics","title":"网格畸变会有什么影响？","short":"降低数值精度，严重时阻碍求解。","points":["检查单元质量和局部几何特征。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0393","cat":"numerics","title":"二维用三角形网格还是四边形网格？","short":"两者都可以，取决于几何、物理场和精度要求。","points":["不要认为某一种永远更准确。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0394","cat":"numerics","title":"稳态模型求解失败应先查什么？","short":"边界约束、材料参数、网格和方程是否完整。","points":["之后再查求解器设置及初始值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0395","cat":"numerics","title":"为什么没有固定约束会出现奇异矩阵？","short":"结构可以发生刚体运动，导致位移不唯一。","points":["应根据真实物理补充合理约束。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0396","cat":"numerics","title":"为什么热传导没有温度参考也可能不唯一？","short":"纯绝热且无参考条件时温度只差一个常数。","points":["需要合理固定平均温度或指定参考温度。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0397","cat":"numerics","title":"为什么稳态扩散模型会没有唯一解？","short":"全域零通量且无浓度参考时，浓度可能只确定到常数。","points":["要补充有物理意义的约束。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0398","cat":"numerics","title":"什么是时间步长？","short":"瞬态求解每次推进的时间间隔。","points":["过大可能遗漏快速变化，过小则计算代价大。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0399","cat":"numerics","title":"时间步长越小结果一定越好吗？","short":"不一定。","points":["还受空间网格、算法阶数、模型误差和舍入误差影响。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0400","cat":"numerics","title":"什么是网格细化比？","short":"不同网格代表长度尺度的比例。","points":["做收敛研究要保持模型物理条件一致。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0401","cat":"numerics","title":"为什么线性问题也可能出现计算误差？","short":"离散、网格、浮点舍入和求解器容差都会引入误差。","points":["解析解仍是有用的参考标准。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0402","cat":"numerics","title":"什么时候用参数扫描？","short":"研究某个参数变化对结果的影响。","points":["所有扫描任务需记录变化范围与其他固定条件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0403","cat":"numerics","title":"什么是求解器收敛日志？","short":"记录残差、迭代次数、失败警告和停止原因。","points":["不能只凭状态栏“完成”判断科学结果。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0404","cat":"numerics","title":"强非线性不收敛怎么办？","short":"检查物理模型、初值、加载步长和材料函数范围。","points":["必要时逐渐加载，避免无依据修改物理参数。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0405","cat":"numerics","title":"为什么非线性求解依赖初值？","short":"不同起点可能走向不同解或无法收敛。","points":["有多个稳定解时更应审查物理合理性。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/validators/solver_validator.py","state":"原理参考"},{"id":"k0406","cat":"debug","title":"结果全是零怎么排查？","short":"先查变量、边界、材料和外部激励是否真的设置。","points":["也检查是否读取了未求解的数据集。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0407","cat":"debug","title":"温度左右颠倒怎么排查？","short":"查边界选区和坐标系，再读回两侧温度表达式。","points":["不能靠颠倒颜色条掩盖问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0408","cat":"debug","title":"位移方向反了怎么办？","short":"查坐标系、载荷方向和符号定义。","points":["负位移不一定代表错误，可能是物理方向如此。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0409","cat":"debug","title":"应力特别大怎么排查？","short":"查单位、受力面积、尖角奇异性和约束。","points":["先看分布与收敛趋势，不只看最大值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0410","cat":"debug","title":"浓度变成负数怎么办？","short":"查边界、离散格式、强对流和数值振荡。","points":["某些数值方法可能出现不合理超调。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0411","cat":"debug","title":"电流方向与预期相反？","short":"检查电极边界正负号和电位定义。","points":["电流密度符号依赖采用的方向约定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0412","cat":"debug","title":"缺材料属性时能不能用 COMSOL 默认值？","short":"除非明确记录并经确认，不应默默使用默认值。","points":["自动模型必须说明数值来自哪里。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0413","cat":"debug","title":"模型树有节点却没有效果？","short":"查节点是否启用、选择对象是否非空、物理接口是否正确。","points":["必须读回配置并检查结果变化。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0414","cat":"debug","title":"读回到的表达式和输入不同怎么办？","short":"核实单位换算、参数别名和表达式解析结果。","points":["不能只比较字符串，需要根据语义和单位判断。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0415","cat":"debug","title":"Java Bridge 401 是什么意思？","short":"表示请求未通过认证。","points":["应检查令牌配置和调用来源，不应绕过认证。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0416","cat":"debug","title":"COMSOL 授权检查失败怎么办？","short":"确认本机许可、模块和并发席位。","points":["不能通过模拟模块结果继续声称真实求解。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0417","cat":"debug","title":"安装后 Python Runtime 启动失败？","short":"查冻结依赖、DLL 和程序日志。","points":["源代码环境正常不能说明打包环境完整。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0418","cat":"debug","title":"SSL 连接失败先查什么？","short":"查证书链、系统时钟、运行时依赖和打包文件。","points":["不要简单关闭证书验证来解决。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0419","cat":"debug","title":"本机 127.0.0.1 端口不通怎么查？","short":"检查服务是否真正启动、端口绑定和本地防火墙。","points":["端口通也不代表连接到正确模型。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0420","cat":"debug","title":"模型运行途中卡死怎么办？","short":"先保留日志，确认是否真实求解或等待资源。","points":["不要直接杀掉与任务无关的 COMSOL 进程。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0421","cat":"debug","title":"参数改了结果没变为什么？","short":"可能没有重新求解、变量不参与方程或读了缓存。","points":["检查表达式依赖和当前数据集。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0422","cat":"debug","title":"为什么图存在而验证失败？","short":"图可能属于旧尝试、文件损坏或与读回条件不一致。","points":["文件存在不自动代表当前结果有效。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0423","cat":"debug","title":"为什么同一几何不同设备选区编号不同？","short":"几何重建或运行环境可能导致实体编号不同。","points":["应通过空间特征确认选区身份。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0424","cat":"debug","title":"为什么出现 NaN 或 Inf？","short":"可能有除零、非法材料函数、发散或奇异系统。","points":["科学验证应直接拒绝非有限数值。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0425","cat":"debug","title":"COMSOL 说收敛但结果不对？","short":"求解器只对当前离散方程负责。","points":["先核对方程、参数、边界和参照解。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0426","cat":"debug","title":"模型能加载却没法修改？","short":"文件导入与可编辑工作流是两件事。","points":["需要确认模型版本和具体 API 支持。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0427","cat":"debug","title":"为什么导出图像和数值 CSV 不一致？","short":"可能数据集、时间步、单位或结果表达式不同。","points":["检查二者是否来自同一次 solve。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0428","cat":"debug","title":"修复后又出现新错误怎么办？","short":"按新的运行编号重新记录并验证全部受影响项目。","points":["不要沿用旧通过状态。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0429","cat":"debug","title":"为什么部署环境能运行但新电脑不能？","short":"检查运行库、权限、路径、许可证及 WebView2。","points":["必须做干净机器的首次安装复测。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/docs/TROUBLESHOOTING.md","state":"知识说明"},{"id":"k0430","cat":"advanced","title":"热传导弱形式是什么意思？","short":"把控制方程乘测试函数并积分，再通过分部积分降低对导数的要求。","points":["有限元通常采用弱形式而不是在每个点直接满足强形式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0431","cat":"advanced","title":"什么是狄利克雷边界？","short":"直接指定变量值的边界。","points":["例如指定温度 T=373 K 或位移 u=0。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0432","cat":"advanced","title":"什么是诺伊曼边界？","short":"指定通量或导数对应物理量的边界。","points":["例如热流密度或受力。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0433","cat":"advanced","title":"什么是罗宾边界？","short":"变量值与通量联合相关的边界。","points":["对流换热 q=h(T-T∞) 是常见形式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0434","cat":"advanced","title":"边界条件多设了会怎样？","short":"可能导致过约束或互相矛盾。","points":["求解器可能报错，也可能隐含优先级让模型偏离预期。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0435","cat":"advanced","title":"什么是初边值问题？","short":"需要控制方程、初始条件及边界条件共同确定解。","points":["瞬态问题缺初值通常不完整。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0436","cat":"advanced","title":"为什么几何上面接触面识别特别难？","short":"两侧可能共享位置，却属于不同域的不同边界实体。","points":["必须区分配对边界和各自物理意义。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0437","cat":"advanced","title":"什么是弱耦合和强耦合？","short":"弱耦合效应小，可能逐步求解；强耦合相互影响显著，可能需一致迭代。","points":["选择求解策略要看具体方程与误差要求。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0438","cat":"advanced","title":"为什么不同物理场网格要协调？","short":"场变量通过共享区域或映射交换信息。","points":["网格不同需正确插值和耦合映射。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0439","cat":"advanced","title":"什么是保守插值？","short":"在场间映射时尽量保持积分守恒量。","points":["直接节点插值不一定保持质量或能量守恒。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0440","cat":"advanced","title":"什么是数值锁死？","short":"某些单元在近不可压缩等条件下表现得过硬。","points":["可能需要混合单元或适当离散方法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0441","cat":"advanced","title":"为什么高阶单元可能更精确？","short":"单元内使用更高次函数近似场变量。","points":["前提是解足够光滑且网格质量合适。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0442","cat":"advanced","title":"什么是应力奇异性？","short":"理想尖角或点载荷模型中局部应力随网格细化可能不收敛。","points":["应改看合理的平均应力、能量或有限区域指标。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0443","cat":"advanced","title":"什么是伪收敛？","short":"迭代停止了但结果未真正满足科学要求。","points":["可能由容差设置、数值病态或错误模型引起。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0444","cat":"advanced","title":"什么是守恒残差？","short":"输入减输出再减积累与源项后剩余的不平衡。","points":["应尽可能使用积分量，并明确归一化方法。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0445","cat":"advanced","title":"误差为什么要归一化？","short":"让不同量纲或尺度的模型结果可以比较。","points":["但分母接近零会导致误差指标失真。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0446","cat":"advanced","title":"如何处理参考解接近零的相对误差？","short":"使用合理的绝对误差门槛或尺度归一化。","points":["不能直接除以极小值而不说明。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0447","cat":"advanced","title":"求解器允许复数结果代表什么？","short":"频域和特征值问题中复数可能正常。","points":["静态实场若出现意外虚部需核查方程与变量。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0448","cat":"advanced","title":"为什么仿真“唯一解”不等于“真实解”？","short":"数学模型可能有唯一解，但模型假设不符合真实材料。","points":["验证建模方程和实验有效性是另一层问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0449","cat":"advanced","title":"逆问题是什么？","short":"通过观测结果反推未知参数或边界。","points":["常存在不唯一和对噪声敏感问题。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0450","cat":"advanced","title":"什么是参数可识别性？","short":"不同参数是否能从观测结果中区分出来。","points":["若两个参数产生几乎相同结果，就很难分别确定。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0451","cat":"advanced","title":"什么是敏感性分析？","short":"改变某个参数，观察输出变化幅度。","points":["有助于识别主要影响因素与测量需求。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0452","cat":"advanced","title":"什么是不确定性传播？","short":"研究输入误差如何影响最终结果。","points":["可用区间、采样或局部线性近似等方式。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0453","cat":"advanced","title":"为什么要校准模型？","short":"使不确定参数更符合独立的观测数据。","points":["校准与验证不能完全使用同一份数据，否则容易过拟合。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0454","cat":"advanced","title":"为什么两个物理场时间尺度不同很难？","short":"需要兼顾快过程和慢过程的时间步长与耦合稳定性。","points":["可能需要分裂算法或隐式耦合。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0455","cat":"advanced","title":"什么是热应力耦合？","short":"温度变化导致热膨胀，引起应变和应力。","points":["需要热膨胀系数以及机械约束条件。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0456","cat":"advanced","title":"热应力的线性热应变怎么估算？","short":"各向同性小变形下，热应变约为 α(T-Tref)。","points":["是否形成应力还取决于机械约束。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0457","cat":"advanced","title":"材料参数有温度区间限制怎么办？","short":"在区间外不得默认外推可靠。","points":["应警告或阻止运行并请求新的材料数据。"],"source":"https://github.com/lovesky514514-cmd/sky-workbench/blob/main/backend/app/scientific/modeling_engine.py","state":"原理参考"},{"id":"k0458","cat":"advanced","title":"什么是非局部效应？"
